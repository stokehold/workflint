# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`.

# The minimum nextest version, which is the version CI installs.
# Older versions stop with an error that names this file.
nextest-version = "0.9.148"

# Print how many conformance fixtures the runner skipped, and why, at the end
# of every run. Every profile uses the overrides of the default profile.
[[profile.default.overrides]]
filter = "binary_id(xtask::conformance) & test(=skipped_fixtures::README.md)"
success-output = "final"

[profile.ci]
# Run every test and report all failures, instead of stopping at the first one.
fail-fast = false
