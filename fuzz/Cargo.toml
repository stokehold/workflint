# The fuzz targets (ADR 0018). This is its own workspace, outside the main
# one, because `cargo fuzz` needs a nightly toolchain. CONTRIBUTING.md says
# how to run it.
[package]
name = "workflint-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
workflint-diagnostics = { path = "../crates/workflint-diagnostics" }
workflint-expr = { path = "../crates/workflint-expr" }
workflint-syntax = { path = "../crates/workflint-syntax" }
workflint-yaml = { path = "../crates/workflint-yaml" }

[workspace]

[[bin]]
name = "yaml_events"
path = "fuzz_targets/yaml_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_tree"
path = "fuzz_targets/yaml_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax"
path = "fuzz_targets/syntax.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob"
path = "fuzz_targets/glob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr_check"
path = "fuzz_targets/expr_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr_lex"
path = "fuzz_targets/expr_lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr_parse"
path = "fuzz_targets/expr_parse.rs"
test = false
doc = false
bench = false
