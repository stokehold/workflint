version: 2
updates:
  - package-ecosystem: cargo
    # fuzz/ is a separate workspace with its own Cargo.lock.
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned to the Unicode version Go uses, so quoting matches actionlint.
      # Bump it by hand. See `is_print` in crates/workflint-diagnostics/src/quote.rs.
      - dependency-name: unicode-general-category
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The base images of docker/Dockerfile, and BuildKit and the SBOM scanner
  # in docker/build-tools.Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
