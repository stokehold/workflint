version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned to the Unicode version Go uses, so quoting matches actionlint.
      # Bump it by hand. See `is_print` in crates/workflint-diagnostics/src/quote.rs.
      - dependency-name: unicode-general-category
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
