name: Reference

on:
  push:
    branches: [main]
    paths:
      - xtask/**
      - .go-version
      - .gitattributes
      - tests/conformance/actionlint/**
      - .github/workflows/reference.yml
  pull_request:
    paths:
      - xtask/**
      - .go-version
      - .gitattributes
      - tests/conformance/actionlint/**
      - .github/workflows/reference.yml

permissions:
  contents: read

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  reference:
    name: cargo xtask reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Add a directory the command must not touch
        run: |
          mkdir -p .reference/research/raw
          echo keep > .reference/research/raw/keep.txt
      - name: First run
        run: cargo xtask reference
      - name: Second run reports every step as up to date
        run: |
          cargo xtask reference | tee second-run.txt
          test "$(wc -l < second-run.txt)" -eq 3
          test "$(grep -c ' is up to date' second-run.txt)" -eq 3
      - name: Reference binary starts
        run: .reference/bin/actionlint -version
      - name: Other directories keep their contents
        run: test "$(cat .reference/research/raw/keep.txt)" = keep
      - name: Vendored test data matches the reference
        run: |
          cargo xtask vendor-testdata | tee vendor-run.txt
          grep -q '^vendor-testdata: tests/conformance/actionlint is up to date' vendor-run.txt
          changes="$(git status --porcelain --ignored --untracked-files=all -- tests/conformance/actionlint)"
          if [ -n "$changes" ]; then
            echo "cargo xtask vendor-testdata changed these files:"
            echo "$changes"
            exit 1
          fi
