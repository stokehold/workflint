name: Release

# Builds the release assets of ADR 0014 (six archives, checksums.txt, an SBOM,
# and the install scripts), attests them, and publishes them as a GitHub
# release (docs/releasing.md). It also builds a PyPI wheel from each archive's
# binary and publishes the wheels to PyPI, builds the Docker images from the
# Linux binaries and pushes them to GHCR, packs the binaries into npm
# packages and publishes them to npm, and tests the Homebrew formula and
# opens a pull request with it in stokehold/homebrew-tap. It tests both
# pre-commit hooks, and asks stokehold/workflint-pre-commit to pin each
# published version. The plan job picks one of three modes:
#
# - release: a push of the tag v<version>, where <version> is the version of
#   the workflint package. Builds, attests, and publishes.
# - dry-run: a pull request that touches the release files. Builds the assets
#   and the wheels, uploads them as workflow artifacts, and installs each
#   wheel.
# - rehearsal: a manual run on main. A dry run that also attests the assets
#   and verifies the attestations.
#
# Publishing stays off until M5.10 (https://github.com/stokehold/workflint/issues/258).
# PUBLISH below is false, so a tag runs every job up to the release job and
# skips the release, pypi-publish, docker-publish, npm-publish,
# homebrew-update, and pre-commit-dispatch jobs.
on:
  push:
    tags: ["v*.*.*"]
  # M6.11 replaces this filter with one required check for every channel.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - scripts/install.sh
      - scripts/install.ps1
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/workflint/Cargo.toml
      - pyproject.toml
      - docker/**
      - npm/**
      - packaging/homebrew/**
      - .pre-commit-hooks.yaml
  workflow_dispatch:

permissions: {}

# One group per ref. A new push to a pull request cancels its older run. A
# tag run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The switch for publishing. The release, pypi-publish, docker-publish,
  # npm-publish, homebrew-update, and pre-commit-dispatch jobs run only on a
  # tag run with this set to "true". M5.10 sets it:
  # https://github.com/stokehold/workflint/issues/258
  PUBLISH: "false"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck passes the release scripts and install.sh
        run: shellcheck scripts/release/*.sh scripts/install.sh
      # The runner image has PSScriptAnalyzer.
      - name: PSScriptAnalyzer passes install.ps1
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Information, Warning, Error
          $findings | Format-Table -AutoSize -Wrap
          if ($findings) { exit 1 }
      - name: Test the release scripts
        run: scripts/release/test.sh
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      # Fails a tag that is not v<version>, before any job builds or
      # publishes.
      - name: Choose the mode and read the version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "workflint") | .version')"
          scripts/release/plan.sh "$EVENT" "$REF" "$version" "$PUBLISH" | tee -a "$GITHUB_OUTPUT"

  # ADR 0021: no secrets, no environment, no caches, and --locked.
  build:
    name: build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive: linux_amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: linux_arm64.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: darwin_amd64.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: darwin_arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: windows_amd64.zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: windows_arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read # checks out the repository
    # One output per target, which only that target's job sets: the SHA-256
    # and the file name of its wheel, as sha256sum prints them. The jobs that
    # check the wheels compare the downloaded wheels with these.
    outputs:
      x86_64-unknown-linux-musl: ${{ steps.wheel.outputs.x86_64-unknown-linux-musl }}
      aarch64-unknown-linux-musl: ${{ steps.wheel.outputs.aarch64-unknown-linux-musl }}
      x86_64-apple-darwin: ${{ steps.wheel.outputs.x86_64-apple-darwin }}
      aarch64-apple-darwin: ${{ steps.wheel.outputs.aarch64-apple-darwin }}
      x86_64-pc-windows-msvc: ${{ steps.wheel.outputs.x86_64-pc-windows-msvc }}
      aarch64-pc-windows-msvc: ${{ steps.wheel.outputs.aarch64-pc-windows-msvc }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      ARCHIVE: workflint_${{ needs.plan.outputs.version }}_${{ matrix.archive }}
      # The second line of `workflint -version` (ADR 0014). The binary reads
      # it at build time with option_env!.
      WORKFLINT_INSTALLED_FROM: installed by downloading from release page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml, which does not list the
      # targets.
      - name: Install the toolchain and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      # cargo-zigbuild runs `python3 -m ziglang` from the virtual environment
      # first on the PATH.
      - name: Install zig
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --no-deps --only-binary :all: --require-hashes -r scripts/release/requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@0.23.4
      # Linux builds link static musl binaries with zig (ADR 0014).
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked -p workflint --target "$TARGET"
          else
            cargo build --release --locked -p workflint --target "$TARGET"
          fi
      - name: Pack the archive
        run: |
          binary="target/$TARGET/release/workflint"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          mkdir -p dist
          scripts/release/package.sh "$binary" "dist/$ARCHIVE"
      # Tests the binary from the archive, so a lost executable bit fails the
      # job too.
      - name: Smoke test the binary in the archive
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          cp "dist/$ARCHIVE" "$unpacked/"
          case "$ARCHIVE" in
            *.zip)
              (cd "$unpacked" && 7z x -bd -bso0 "$ARCHIVE")
              binary="$unpacked/workflint.exe"
              ;;
            *)
              tar -xzf "$unpacked/$ARCHIVE" -C "$unpacked"
              binary="$unpacked/workflint"
              ;;
          esac
          scripts/release/smoke-test.sh "$binary" "$VERSION"
          # Without the variable at run time, the second line comes from the
          # value at build time.
          want="$WORKFLINT_INSTALLED_FROM"
          got="$(env -u WORKFLINT_INSTALLED_FROM "$binary" -version | sed -n 2p | tr -d '\r')"
          if [ "$got" != "$want" ]; then
            echo "::error::The second line of -version is '$got', not '$want'."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error
      # maturin runs from its own virtual environment, so that the python3 of
      # the zig environment stays first on the PATH.
      - name: Install maturin
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python=python bin=Scripts; else python=python3 bin=bin; fi
          "$python" -m venv "$RUNNER_TEMP/maturin"
          "$RUNNER_TEMP/maturin/$bin/python" -m pip install --no-deps --only-binary :all: --require-hashes \
            -r scripts/release/requirements-maturin.txt
          echo "MATURIN=$RUNNER_TEMP/maturin/$bin/maturin" >> "$GITHUB_ENV"
      # The binary-only wheel of pyproject.toml, from the same sources, flags,
      # and WORKFLINT_INSTALLED_FROM as the archive. On Linux, maturin links
      # with its own copy of cargo-zigbuild, so cargo links the binary again.
      # The static musl binary runs on glibc and musl systems, so the Linux
      # wheel carries both tags (docs/releasing.md).
      - name: Build the wheel
        run: |
          args=(build --release --locked --target "$TARGET" --out wheel)
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--zig --compatibility manylinux2014 musllinux_1_1)
          fi
          "$MATURIN" "${args[@]}"
      # ADR 0014: every channel ships the binary of the release archives.
      - name: Compare the binary in the wheel with the one in the archive
        run: scripts/release/compare-wheel.sh wheel/*.whl "dist/$ARCHIVE"
      - name: Record the SHA-256 of the wheel
        id: wheel
        run: |
          wheel="$(cd wheel && echo *.whl)"
          if command -v sha256sum > /dev/null; then
            hash="$(sha256sum "wheel/$wheel" | cut -d ' ' -f 1)"
          else
            hash="$(shasum -a 256 "wheel/$wheel" | cut -d ' ' -f 1)"
          fi
          echo "$hash  $wheel"
          echo "$TARGET=$hash  $wheel" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheel/*.whl
          if-no-files-found: error

  sbom:
    name: sbom
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9
      # One CycloneDX SBOM of the dependencies of the workflint binary on
      # every target, from Cargo.lock. cargo-cyclonedx writes a file for each
      # workspace member, and the job keeps the one of the workflint crate.
      # SOURCE_DATE_EPOCH makes the timestamp that of the commit, so the same
      # commit gives the same file.
      - name: Write the SBOM
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --manifest-path crates/workflint/Cargo.toml --format json \
            --spec-version 1.5 --target all --override-filename "workflint_$VERSION.cdx"
          mkdir -p dist
          mv "crates/workflint/workflint_$VERSION.cdx.json" dist/
          jq -r '"\(.metadata.component.name) \(.metadata.component.version): \(.components | length) components"' \
            "dist/workflint_$VERSION.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/workflint_${{ env.VERSION }}.cdx.json
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [plan, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The wheels are not release assets.
          pattern: "{archive-*,sbom}"
          path: dist
          merge-multiple: true
      # The copies of the install scripts that install this version by
      # default. They are written before checksums.txt, so the attested and
      # uploaded files are the ones listed there.
      - name: Write the install scripts
        run: scripts/release/install-scripts.sh "$VERSION" dist
      - name: Write checksums.txt
        run: |
          (cd dist && sha256sum -- * | LC_ALL=C sort -k 2) > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" dist/checksums.txt
          cat dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)
      - name: Check the assets
        run: scripts/release/check-assets.sh dist "$VERSION"
      - name: List the assets in the job summary
        run: scripts/release/summary.sh dist "$MODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-scripts
          path: |
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error

  # Tests install.sh and install.ps1 against this run's assets, served from
  # 127.0.0.1, since no release exists to download from. install.sh runs in
  # Git Bash on Windows and with bash 3.2 on macOS, and install.ps1 runs in
  # pwsh, and in Windows PowerShell 5.1 on Windows.
  # ADR 0021: no secrets, no environment, and only contents: read.
  install-scripts:
    name: install scripts (${{ matrix.runner }})
    needs: [plan, checksums]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,sbom,checksums,install-scripts}"
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Test the install scripts
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: scripts/release/test-install.sh "$ASSETS" "$VERSION"

  # Attests every asset on tag runs and rehearsals. A rehearsal then verifies
  # each attestation as a user would.
  attest:
    name: attest
    needs: [plan, checksums]
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # signs the attestations with the workflow's identity
      attestations: write # stores the attestations in the repository
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,sbom,checksums,install-scripts}"
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify the attestations
        if: env.MODE == 'rehearsal'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done

  # Every job that publishes needs this one.
  gate:
    name: gate
    needs: plan
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checks out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo test --workspace --locked
      # TODO(#287): run `cargo xtask bench` here and fail on a missed target
      # (ADR 0019).

  release:
    name: release
    needs: [plan, checksums, install-scripts, attest, gate]
    # Runs only when the plan job says to publish: on a tag run, with PUBLISH
    # set to "true". Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # creates, uploads to, and publishes the release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,sbom,checksums,install-scripts}"
          path: dist
          merge-multiple: true
      - name: Verify the checksums and the attestations
        run: |
          scripts/release/check-assets.sh dist "$VERSION"
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      # The release is immutable once published, so every asset goes up while
      # it is a draft: the archives, checksums.txt, the SBOM, and the install
      # scripts. A later task that adds assets uploads them here, before the
      # publishing step.
      - name: Create a draft release with the assets
        run: |
          scripts/release/notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
            --title "$TAG" "${notes[@]}" dist/*
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # Checks the wheels as pypi-publish does before it uploads them, and runs
  # twine check on their metadata.
  pypi-check:
    name: pypi-check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    env:
      RECORDED: ${{ toJSON(needs.build.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - name: Check the wheels against the checksums of the build jobs
        run: |
          jq -r '.[]' <<< "$RECORDED" > "$RUNNER_TEMP/wheels.sha256"
          scripts/release/check-wheels.sh wheels "$RUNNER_TEMP/wheels.sha256"
      - name: Install twine
        run: |
          python3 -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/python" -m pip install --only-binary :all: --require-hashes \
            -r scripts/release/requirements-twine.txt
      - name: twine check
        run: '"$RUNNER_TEMP/twine/bin/twine" check --strict wheels/*.whl'

  # Installs each wheel with pip and with uvx on a runner of its platform, and
  # runs the smoke test on the installed binary.
  pypi-smoke:
    name: pypi-smoke (${{ matrix.target }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheel
      - name: Smoke test the wheel
        run: scripts/release/smoke-test-wheel.sh wheel/*.whl "$VERSION"

  # Installs the x86_64 Linux wheel on a musl system, as its musllinux tag
  # promises.
  pypi-smoke-alpine:
    name: pypi-smoke (alpine)
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: python:3-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # The image has no bash, the default shell of this workflow.
      - name: Install bash
        shell: sh
        run: apk add --no-cache bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-x86_64-unknown-linux-musl
          path: wheel
      - name: Smoke test the wheel
        run: scripts/release/smoke-test-wheel.sh wheel/*.whl "$VERSION"

  # Uploads the wheels to PyPI with trusted publishing, after the GitHub
  # release is published. PyPI's trusted publisher for workflint names this
  # workflow and the release environment, so the job needs both and no token.
  # The action creates a PEP 740 attestation for each wheel.
  pypi-publish:
    name: pypi-publish
    needs: [plan, build, release, pypi-check, pypi-smoke, pypi-smoke-alpine]
    # Runs only when the plan job says to publish, as the release job does.
    # Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write # trusted publishing to PyPI, and the PEP 740 attestations
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      RECORDED: ${{ toJSON(needs.build.outputs) }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,sbom,checksums,install-scripts}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - name: Verify the release assets and their attestations
        run: |
          scripts/release/check-assets.sh dist "$VERSION"
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Check the wheels against the checksums of the build jobs
        run: |
          jq -r '.[]' <<< "$RECORDED" > "$RUNNER_TEMP/wheels.sha256"
          scripts/release/check-wheels.sh wheels "$RUNNER_TEMP/wheels.sha256"
      # A re-run skips the wheels that PyPI already has.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels/
          skip-existing: true

  # Runs the workflint-system hook of .pre-commit-hooks.yaml with the
  # x86_64 Linux binary of this run, and the workflint hook of the mirror
  # stokehold/workflint-pre-commit with this run's wheels, pinned to this
  # run's version. pip installs from the wheels with no index, so the test
  # needs nothing on PyPI.
  # ADR 0021: no secrets, no environment, and only contents: read.
  pre-commit:
    name: pre-commit
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCHIVE: workflint_${{ needs.plan.outputs.version }}_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mirror is public, so the checkout needs no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stokehold/workflint-pre-commit
          ref: main
          path: ${{ runner.temp }}/workflint-pre-commit
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: ${{ runner.temp }}/wheels
          merge-multiple: true
      - name: Install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install --only-binary :all: --require-hashes \
            -r scripts/release/requirements-pre-commit.txt
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"
      - name: Test the workflint-system hook
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/archive/$ARCHIVE" -C "$RUNNER_TEMP/bin" workflint
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/release/test-pre-commit.sh . workflint-system
      # pip builds the mirror's package with setuptools, so setuptools goes
      # next to the wheels. The workflint binary is not on the PATH, so the
      # hook runs the one from the wheel.
      - name: Test the workflint hook of the mirror
        env:
          MIRROR: ${{ runner.temp }}/workflint-pre-commit
          PIP_FIND_LINKS: ${{ runner.temp }}/wheels
          PIP_NO_INDEX: "1"
        run: |
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip download --no-deps --only-binary :all: --require-hashes \
            -r scripts/release/requirements-setuptools.txt -d "$PIP_FIND_LINKS"
          echo "The mirror is at $(git -C "$MIRROR" rev-parse HEAD)."
          "$MIRROR/scripts/set-version.sh" "$VERSION"
          git -C "$MIRROR" diff
          scripts/release/test-pre-commit.sh "$MIRROR" workflint

  # Sends stokehold/workflint-pre-commit a workflint-release event with the
  # version, after the wheels are on PyPI. The mirror's update workflow then
  # opens a pull request that pins the version.
  pre-commit-dispatch:
    name: pre-commit-dispatch
    needs: [plan, pypi-publish, pre-commit]
    # Runs only when the plan job says to publish, as the release job does.
    # Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Mint a stokehold-bot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STOKEHOLD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STOKEHOLD_BOT_PRIVATE_KEY }}
          repositories: workflint-pre-commit
          permission-contents: write # sends the repository_dispatch event
      - name: Send the workflint-release event
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          jq -n --arg version "$VERSION" '{event_type: "workflint-release", client_payload: {version: $version}}' \
            | gh api repos/stokehold/workflint-pre-commit/dispatches --input -

  # Builds the default and full images of docker/Dockerfile for one
  # architecture, on a runner of that architecture, from the binary of the
  # release archive. Exports each image as an OCI layout with provenance and
  # SBOM attestations, and checks it. Pushes nothing.
  # ADR 0021: no secrets, no environment, no caches, and only contents: read.
  docker-build:
    name: docker-build (${{ matrix.arch }})
    needs: [plan, checksums]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # checks out the repository
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.plan.outputs.version }}
      ARCHIVE: workflint_${{ needs.plan.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-${{ matrix.target }},checksums}"
          path: dist
          merge-multiple: true
      - name: Check the archive against checksums.txt and unpack its binary
        run: |
          if ! grep -E "^[0-9a-f]{64}  $ARCHIVE\$" dist/checksums.txt > "$RUNNER_TEMP/archive.sha256"; then
            echo "::error::checksums.txt has no line for $ARCHIVE."
            exit 1
          fi
          (cd dist && sha256sum -c --strict "$RUNNER_TEMP/archive.sha256")
          mkdir -p "$RUNNER_TEMP/context/linux_$ARCH"
          tar -xzf "dist/$ARCHIVE" -C "$RUNNER_TEMP/context/linux_$ARCH" workflint
      # docker/build-tools.Dockerfile pins BuildKit and the SBOM scanner. The
      # docker driver of the runner cannot export attestations.
      - name: Create the builder
        run: |
          buildkit="$(sed -n 's/^FROM \([^ ]*\) AS buildkit$/\1/p' docker/build-tools.Dockerfile)"
          docker buildx create --name workflint --driver docker-container \
            --driver-opt "image=$buildkit" --bootstrap
          docker buildx version
          skopeo --version
      - name: Build the images
        env:
          CONTEXT: ${{ runner.temp }}/context
        run: |
          scanner="$(sed -n 's/^FROM \([^ ]*\) AS sbom-scanner$/\1/p' docker/build-tools.Dockerfile)"
          for stage in default full; do
            docker buildx build docker --builder workflint --platform "linux/$ARCH" --target "$stage" \
              --build-context "dist=$CONTEXT" --build-arg "VERSION=$VERSION" \
              --provenance mode=max --sbom "generator=$scanner" \
              --output "type=oci,dest=oci/$stage-$ARCH,tar=false"
          done
      # Loads the exported layouts, not a second build, so the checks see the
      # images that the later jobs attest and push.
      - name: Check the images
        run: |
          for stage in default full; do
            skopeo copy "oci:oci/$stage-$ARCH" "docker-daemon:workflint:$stage"
            scripts/release/check-image.sh "workflint:$stage" "$stage" "dist/$ARCHIVE" "$VERSION"
          done
      - name: List the image sizes in the job summary
        run: |
          {
            echo "## Docker images (linux/$ARCH)"
            echo
            echo "| Image | Compressed size in bytes | Size in bytes |"
            echo "| --- | ---: | ---: |"
            for stage in default full; do
              compressed="$(skopeo inspect --raw "oci:oci/$stage-$ARCH" \
                | jq -r '.manifests[] | select(.platform.os == "linux") | .digest' \
                | while read -r digest; do jq '[.layers[].size] | add' "oci/$stage-$ARCH/blobs/sha256/${digest#sha256:}"; done)"
              size="$(docker image inspect --format '{{.Size}}' "workflint:$stage")"
              echo "| \`$stage\` | $compressed | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-oci-${{ matrix.arch }}
          path: oci/
          if-no-files-found: error

  # Merges the layouts of the two architectures into one multi-platform
  # layout per image, and checks that skopeo copies each one without changing
  # its digest, as docker-publish does.
  docker-index:
    name: docker-index
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    outputs:
      default: ${{ steps.merge.outputs.default }}
      full: ${{ steps.merge.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-oci-*
          path: oci
          merge-multiple: true
      - name: Merge the layouts
        id: merge
        run: |
          echo "## Docker image digests" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for stage in default full; do
            digest="$(scripts/release/merge-oci.sh "images/$stage" "oci/$stage-amd64" "oci/$stage-arm64")"
            copied="$RUNNER_TEMP/copy-$stage"
            skopeo copy --all --preserve-digests "oci:images/$stage" "oci:$copied"
            got="sha256:$(skopeo inspect --raw "oci:$copied" | sha256sum | cut -d ' ' -f 1)"
            if [ "$got" != "$digest" ]; then
              echo "::error::The copy of the $stage image has the digest $got, not $digest."
              exit 1
            fi
            echo "$stage: $digest"
            echo "- \`$stage\`: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$stage=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-images
          path: images/
          if-no-files-found: error

  # Attests the index digest of each image under the image's name, without
  # pushing anything. The digest of an OCI layout stays the same when
  # docker-publish copies it to GHCR, so the attestations hold for the pushed
  # images. A rehearsal verifies them with gh attestation verify on the index
  # blob of each layout, a file whose SHA-256 is the image's digest.
  docker-attest:
    name: docker-attest
    needs: [plan, docker-index]
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # signs the attestations with the workflow's identity
      attestations: write # stores the attestations in the repository
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      DEFAULT: ${{ needs.docker-index.outputs.default }}
      FULL: ${{ needs.docker-index.outputs.full }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-images
          path: images
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/stokehold/workflint
          subject-digest: ${{ env.DEFAULT }}
          push-to-registry: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/stokehold/workflint
          subject-digest: ${{ env.FULL }}
          push-to-registry: false
      - name: Verify the attestations
        if: env.MODE == 'rehearsal'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for pair in "default $DEFAULT" "full $FULL"; do
            read -r stage digest <<< "$pair"
            gh attestation verify "images/$stage/blobs/sha256/${digest#sha256:}" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done

  # Pushes the attested layouts to GHCR after the GitHub release is
  # published, without building again, and checks the digest of every pushed
  # tag. The first push creates a private package, which the maintainer makes
  # public (docs/releasing.md).
  docker-publish:
    name: docker-publish
    needs: [plan, docker-index, docker-attest, release]
    # Runs only when the plan job says to publish, as the release job does.
    # Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read # checks out the repository
      packages: write # pushes the images to ghcr.io/stokehold/workflint
    env:
      IMAGE: ghcr.io/stokehold/workflint
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      DEFAULT: ${{ needs.docker-index.outputs.default }}
      FULL: ${{ needs.docker-index.outputs.full }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-images
          path: images
      - name: Verify the attestations
        run: |
          for pair in "default $DEFAULT" "full $FULL"; do
            read -r stage digest <<< "$pair"
            gh attestation verify "images/$stage/blobs/sha256/${digest#sha256:}" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
        run: |
          skopeo login ghcr.io --authfile "$RUNNER_TEMP/containers-auth.json" \
            --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Push the images
        run: |
          authfile="$RUNNER_TEMP/containers-auth.json"
          for pair in "default $DEFAULT" "full $FULL"; do
            read -r stage digest <<< "$pair"
            for tag in $(scripts/release/docker-tags.sh "$VERSION" "$stage"); do
              skopeo copy --all --preserve-digests --authfile "$authfile" "oci:images/$stage" "docker://$IMAGE:$tag"
              pushed="sha256:$(skopeo inspect --raw --authfile "$authfile" "docker://$IMAGE:$tag" | sha256sum | cut -d ' ' -f 1)"
              if [ "$pushed" != "$digest" ]; then
                echo "::error::$IMAGE:$tag has the digest $pushed, not the attested $digest."
                exit 1
              fi
              echo "$IMAGE:$tag is $digest"
            done
          done
      - name: Log out of GHCR
        if: always()
        run: rm -f "$RUNNER_TEMP/containers-auth.json"

  # Writes the seven npm packages from this run's archives, without building
  # Rust, packs them, and checks each binary against its archive
  # (docs/releasing.md).
  npm-pack:
    name: npm-pack
    needs: [plan, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
    # The SHA-256 and file name of each tarball, as sha256sum prints them.
    # npm-publish compares the downloaded tarballs with these.
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,checksums}"
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check the archives against checksums.txt
        run: |
          cd dist
          for archive in workflint_*; do
            grep -q -F "  $archive" checksums.txt || { echo "::error::checksums.txt does not list $archive"; exit 1; }
          done
          sha256sum -c --ignore-missing checksums.txt
      - name: Write and pack the packages
        run: scripts/release/npm-pack.sh "$VERSION" dist npm-dist
      # check-npm.sh also fails a package.json with scripts, so nothing runs
      # at install time.
      - name: Check the packages against the archives
        run: scripts/release/check-npm.sh npm-dist dist "$VERSION"
      - name: List the files of workflint
        run: npm pack --dry-run "./npm-dist/workflint-$VERSION.tgz"
      - name: Record the SHA-256 of the tarballs
        id: record
        run: |
          (cd npm-dist && sha256sum -- *.tgz) | tee "$RUNNER_TEMP/npm.sha256"
          {
            echo "sha256<<EOF"
            cat "$RUNNER_TEMP/npm.sha256"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-dist/*.tgz
          if-no-files-found: error

  # Runs the launcher's tests, then installs the packages with npm, pnpm, and
  # Bun from a registry on 127.0.0.1, so that each package manager resolves
  # the optional dependencies itself, and runs the smoke test.
  npm-smoke:
    name: npm-smoke (${{ matrix.runner }})
    needs: [plan, npm-pack]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-dist
      - name: Test the launcher
        run: node --test "npm/workflint/test/*.test.js"
      - name: Smoke test the packages
        run: scripts/release/smoke-test-npm.sh npm-dist "$VERSION"

  # Publishes the npm packages with trusted publishing, after the GitHub
  # release is published. npm's trusted publisher for each package names this
  # workflow and the release environment, so the job needs both and no token.
  # npm adds a provenance statement to each package.
  npm-publish:
    name: npm-publish
    needs: [plan, release, npm-pack, npm-smoke]
    # Runs only when the plan job says to publish, as the release job does.
    # Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write # trusted publishing to npm, and the provenance statements
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      RECORDED: ${{ needs.npm-pack.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,checksums}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-dist
      - name: Verify the archives and their attestations
        run: |
          (cd dist && sha256sum -c --ignore-missing checksums.txt)
          for file in dist/workflint_*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Check the tarballs against the checksums of npm-pack
        run: |
          printf '%s\n' "$RECORDED" > "$RUNNER_TEMP/npm.sha256"
          if [ "$(grep -c . "$RUNNER_TEMP/npm.sha256")" -ne 7 ]; then
            echo "::error::npm-pack recorded $(grep -c . "$RUNNER_TEMP/npm.sha256") tarballs, not 7"
            exit 1
          fi
          (cd npm-dist && sha256sum -c -) < "$RUNNER_TEMP/npm.sha256"
          scripts/release/check-npm.sh npm-dist dist "$VERSION"
      # No registry-url, so setup-node writes no .npmrc with a token line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)' "$(npm --version)"
      - name: Publish the packages
        run: scripts/release/npm-publish.sh npm-dist "$VERSION"

  # Renders the Homebrew formula with file:// URLs of this run's archives,
  # installs it from a local tap, and runs brew style, brew audit --strict,
  # brew test, and the smoke test (docs/releasing.md#homebrew).
  # ADR 0021: no secrets, no environment, and only contents: read.
  homebrew:
    name: homebrew (${{ matrix.runner }})
    needs: [plan, checksums]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # checks out the repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,checksums}"
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      # The Ubuntu image has Homebrew, but not on the PATH.
      - name: Put Homebrew on the PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Test the formula
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: scripts/release/test-homebrew.sh "$ASSETS" "$VERSION"

  # Opens the pull request in stokehold/homebrew-tap that updates the formula
  # to this release, after the GitHub release is published, and turns on its
  # auto-merge. The tap merges it when its tests pass. The job needs no
  # permissions for the GITHUB_TOKEN: the repository is public, and the tap
  # takes a stokehold-bot token scoped to it alone.
  homebrew-update:
    name: homebrew-update
    needs: [plan, release, homebrew]
    # Runs only when the plan job says to publish, which happens only on a
    # tag run. Publishing stays off until M5.10:
    # https://github.com/stokehold/workflint/issues/258
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: ${{ runner.temp }}/run
      # The formula takes its SHA-256 values from the published release, which
      # must be the checksums.txt that this run wrote and attested.
      - name: Download checksums.txt from the release and verify it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --dir "$RUNNER_TEMP/release"
          gh attestation verify "$RUNNER_TEMP/release/checksums.txt" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG"
          cmp "$RUNNER_TEMP/run/checksums.txt" "$RUNNER_TEMP/release/checksums.txt"
      - name: Render the formula
        run: |
          scripts/release/homebrew-formula.sh "$VERSION" "$RUNNER_TEMP/release/checksums.txt" \
            "https://github.com/$REPO/releases/download/$TAG" > "$RUNNER_TEMP/workflint.rb"
          cat "$RUNNER_TEMP/workflint.rb"
      - name: Mint a stokehold-bot token for the tap
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STOKEHOLD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STOKEHOLD_BOT_PRIVATE_KEY }}
          owner: stokehold
          repositories: homebrew-tap
          permission-contents: write # creates the branch and commits the formula
          permission-pull-requests: write # opens the pull request and turns on its auto-merge
      - name: Open or update the pull request in the tap
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/release/homebrew-update.sh "$RUNNER_TEMP/workflint.rb" "$VERSION"
