name: Fuzz

# Every night, each fuzz target in fuzz/ runs for five minutes (ADR 0018). On
# pull requests that could break them, the targets are only built.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - crates/workflint-diagnostics/**
      - crates/workflint-yaml/**
      - fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The prebuilt cargo-fuzz is a musl binary and builds for musl by default,
  # where the address sanitizer does not work.
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: cargo fuzz build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cargo fmt --all` in the main workspace skips fuzz/.
      - name: Check formatting
        run: rustfmt --check --edition 2024 fuzz/fuzz_targets/*.rs
      - name: Install the nightly toolchain from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      # cargo fuzz has no --locked flag, so this fails if fuzz/Cargo.lock is stale.
      - name: Check fuzz/Cargo.lock
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Build the fuzz targets
        working-directory: fuzz
        run: cargo fuzz build --target "$FUZZ_BUILD_TARGET"

  run:
    name: cargo fuzz run (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target: [yaml_events, yaml_tree]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly toolchain from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - name: Write the seed inputs
        run: cargo xtask fuzz-seeds
      - name: Check fuzz/Cargo.lock
        working-directory: fuzz
        run: cargo fetch --locked
      # An input that runs longer than 10 seconds counts as a hang and fails
      # the run like a crash.
      - name: Fuzz for five minutes
        working-directory: fuzz
        run: cargo fuzz run --target "$FUZZ_BUILD_TARGET" "$TARGET" -- -max_total_time=300 -timeout=10
        env:
          TARGET: ${{ matrix.target }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
