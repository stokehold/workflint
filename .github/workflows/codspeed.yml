name: CodSpeed

# Runs the divan micro-benchmarks under CodSpeed, which counts instructions
# instead of measuring wall time (ADR 0019). CodSpeed posts the comparison with
# the base branch as a pull request comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The OIDC token gives no access to the repository, and the job needs no secret.
      id-token: write # CodSpeed authenticates the upload with an OIDC token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also caches ~/.cargo/bin, so cargo install finds cargo-codspeed there.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # install-action has no checksum for cargo-codspeed and would fall back
      # to an unpinned cargo-binstall, so the job builds it with cargo install.
      - name: Install cargo-codspeed
        run: cargo install --locked --version 5.0.3 cargo-codspeed
      - run: cargo codspeed build --workspace
      - uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run --workspace
