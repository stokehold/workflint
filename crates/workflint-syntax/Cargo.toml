[package]
name = "workflint-syntax"
description = "Workflow AST and parser of workflint. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src", "/README.md"]

[dependencies]
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }
workflint-expr = { path = "../workflint-expr", version = "0.0.1" }
workflint-yaml = { path = "../workflint-yaml", version = "0.0.1" }

[dev-dependencies]
# divan's API, measured by CodSpeed in CI and by divan on `cargo bench` (ADR 0019).
divan = { package = "codspeed-divan-compat", version = "5.0.3" }
# Reads the largest corpus file from the vendored archive for the parser benchmark.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
