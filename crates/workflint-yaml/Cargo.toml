[package]
name = "workflint-yaml"
description = "YAML layer of workflint: a span tree built on a vendored libyaml-safer event parser. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the yaml-test-suite data and the benchmarks out of the published package (ADR 0006).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
# Scalar values of up to 23 bytes, most of a workflow's, without an allocation each.
smol_str = "0.3.7"
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }

[dev-dependencies]
datatest-stable = "0.3.3"
# divan's API, measured by CodSpeed in CI and by divan on `cargo bench` (ADR 0019).
divan = { package = "codspeed-divan-compat", version = "5.0.3" }
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[test]]
name = "yaml_test_suite"
harness = false

[[test]]
name = "fuzz_regressions"
harness = false

[[test]]
name = "fixture_events"
harness = false

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
