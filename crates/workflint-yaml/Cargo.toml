[package]
name = "workflint-yaml"
description = "YAML layer of workflint: a span tree built on a vendored libyaml-safer event parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the yaml-test-suite data out of the published package (ADR 0006).
include = ["/src", "/README.md"]

[dependencies]
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }

[dev-dependencies]
datatest-stable = "0.3.3"
insta = "1.49.0"

[[test]]
name = "yaml_test_suite"
harness = false

[[test]]
name = "fuzz_regressions"
harness = false

[lints]
workspace = true
