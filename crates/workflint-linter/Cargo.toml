[package]
name = "workflint-linter"
description = "Parallel driver, project discovery, and caches of workflint. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the tests out of the published package (ADR 0006).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
rayon = "1.12.0"
regex = "1.13.1"
regex-syntax = "0.8.11"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }
workflint-rules = { path = "../workflint-rules", version = "0.0.1" }
workflint-syntax = { path = "../workflint-syntax", version = "0.0.1" }
workflint-yaml = { path = "../workflint-yaml", version = "0.0.1" }

[dev-dependencies]
tempfile = "3.27.0"

# The external tool that the tests of the `tool` module run, so that they need no system tool and
# behave the same on every OS. It is not published: `include` leaves out `/tests`.
[[bin]]
name = "workflint-test-tool"
path = "tests/support/test_tool.rs"
test = false
doc = false

[lints]
workspace = true
