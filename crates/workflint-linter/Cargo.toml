[package]
name = "workflint-linter"
description = "Project discovery and caches of workflint. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the tests out of the published package (ADR 0006).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }
workflint-rules = { path = "../workflint-rules", version = "0.0.1" }
workflint-syntax = { path = "../workflint-syntax", version = "0.0.1" }
workflint-yaml = { path = "../workflint-yaml", version = "0.0.1" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
