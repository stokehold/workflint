[package]
name = "workflint-diagnostics"
description = "Diagnostic types for workflint. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the test fixtures and the benchmarks out of the published package (ADR 0006).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
thiserror = "2.0.21"
# Pinned to Unicode 15.0.0, the version Go uses. See `quote::is_print`.
unicode-general-category = "=0.6.0"
# The default `cjk` feature adds widths for CJK locales, which output must not depend on.
unicode-width = { version = "0.2.2", default-features = false }

[dev-dependencies]
datatest-stable = "0.3.3"
# divan's API, measured by CodSpeed in CI and by divan on `cargo bench` (ADR 0019).
divan = { package = "codspeed-divan-compat", version = "5.0.3" }
insta = "1.49.0"

[[bench]]
name = "source"
harness = false

[[test]]
name = "fuzz_regressions"
harness = false

[lints]
workspace = true
