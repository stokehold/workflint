[package]
name = "workflint-expr"
description = "Expression engine of workflint: the lexer, parser, and type system of `${{ }}` expressions. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the tests and the benchmarks out of the published package (ADR 0006).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
workflint-data = { path = "../workflint-data", version = "0.0.1" }
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }

[dev-dependencies]
datatest-stable = "0.3.3"
# divan's API, measured by CodSpeed in CI and by divan on `cargo bench` (ADR 0019).
divan = { package = "codspeed-divan-compat", version = "5.0.3" }

[[test]]
name = "fuzz_regressions"
harness = false

[[bench]]
name = "expressions"
harness = false

[lints]
workspace = true
