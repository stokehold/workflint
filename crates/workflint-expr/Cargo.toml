[package]
name = "workflint-expr"
description = "Expression engine of workflint: the lexer, parser, and type system of `${{ }}` expressions. Internal crate with no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Keep the tests out of the published package (ADR 0006).
include = ["/src", "/README.md"]

[dependencies]
workflint-data = { path = "../workflint-data", version = "0.0.1" }
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }

[lints]
workspace = true
