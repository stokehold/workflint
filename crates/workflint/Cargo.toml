[package]
name = "workflint"
description = "A fast linter for GitHub Actions workflows, compatible with actionlint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["github-actions", "linter", "workflow", "ci", "actionlint"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }
workflint-rules = { path = "../workflint-rules", version = "0.0.1" }
workflint-syntax = { path = "../workflint-syntax", version = "0.0.1" }
workflint-yaml = { path = "../workflint-yaml", version = "0.0.1" }

[lints]
workspace = true
