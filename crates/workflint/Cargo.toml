[package]
name = "workflint"
description = "A fast linter for GitHub Actions workflows, compatible with actionlint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["github-actions", "linter", "workflow", "ci", "actionlint"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
workflint-diagnostics = { path = "../workflint-diagnostics", version = "0.0.1" }
workflint-linter = { path = "../workflint-linter", version = "0.0.1" }

[lints]
workspace = true

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
workflint-rules = { path = "../workflint-rules", version = "0.0.1" }
