[package]
name = "xtask"
description = "Developer commands for the workflint repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.2"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
similar = "3.2.0"
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
workflint-data = { path = "../crates/workflint-data", version = "0.0.1" }
workflint-diagnostics = { path = "../crates/workflint-diagnostics", version = "0.0.1" }
workflint-expr = { path = "../crates/workflint-expr", version = "0.0.1" }
workflint-rules = { path = "../crates/workflint-rules", version = "0.0.1" }
workflint-syntax = { path = "../crates/workflint-syntax", version = "0.0.1" }
workflint-yaml = { path = "../crates/workflint-yaml", version = "0.0.1" }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
datatest-stable = "0.3.3"

[[test]]
name = "conformance"
harness = false
