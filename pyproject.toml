# The PyPI package: binary-only wheels of the workflint binary (ADR 0014).
# The build jobs of .github/workflows/release.yml build one wheel per target
# with maturin. docs/releasing.md describes them.
[build-system]
# The same version as scripts/release/requirements-maturin.txt.
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "workflint"
dynamic = ["version"]
description = "A fast linter for GitHub Actions workflows, compatible with actionlint"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["github-actions", "linter", "workflow", "ci", "actionlint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/stokehold/workflint"
Documentation = "https://github.com/stokehold/workflint#documentation"
Changelog = "https://github.com/stokehold/workflint/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/workflint/Cargo.toml"
