# The policy for both workspaces: the root and fuzz/. CI runs
# `cargo deny check` and `cargo deny --manifest-path fuzz/Cargo.toml check`,
# and both find this file.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer, which is under NCSA. Only the fuzz
# workspace uses it, and no published crate depends on it (ADR 0025).
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The fuzz crate is not published, so its path dependencies need no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
