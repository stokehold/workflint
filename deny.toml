# The policy for the root workspace. CI runs `cargo deny check`. The fuzz/
# workspace has its own copy in fuzz/deny.toml, which allows the licenses its
# dependencies use. Keep the two in step.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The licenses that the dependencies use, from the list in ADR 0017. ADR 0017
# also permits BSD-2-Clause and ISC. Add one here when a dependency needs it,
# as cargo deny warns about an allowance nothing uses. BSD-3-Clause is for
# workflint-gotemplate, which ports code from Go (ADR 0035).
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
