on: push
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            experimental: true
          - ${{ fromJSON(vars.EXTRA) }}
        exclude:
          # ERROR: `include` adds windows-latest after `exclude` runs
          - os: windows-latest
          # ERROR: `experimental` is not a row
          - os: ubuntu-latest
            experimental: true
          # OK: Both values are in the rows, and the include expression does not stop the check
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo
