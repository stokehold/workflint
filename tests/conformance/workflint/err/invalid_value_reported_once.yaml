on:
  # Activity types that are not non-empty strings
  pull_request:
    types: [[x]]
  pull_request_target:
    types: ['']
  issues:
    types: ''
  release:
    types:
  # An event key that is not a string
  [a]: x
  workflow_dispatch:
    inputs:
      # Options are set, so the input must be a choice
      text:
        type: string
        options: [[x]]
      # Options are set, so the choice has options
      pick:
        type: choice
        options: ['']
defaults:
  run:
    shell: ''
jobs:
  test:
    runs-on: [ubuntu-latest, '']
    steps:
      - run: echo hello
        shell: [x]
      # Action specs that are empty or not strings
      - uses: ''
      - uses: [x]
  credentials:
    runs-on: ubuntu-latest
    # Passwords that are empty or not strings
    container:
      image: node:24
      credentials:
        username: user
        password: ''
    services:
      redis:
        image: redis
        credentials:
          username: user
          password: [x]
    steps:
      # Step IDs that are empty
      - id: ''
        run: echo hello
      - id: ''
        run: echo hello
  call:
    uses: ./.github/workflows/number_input.yaml
    # An input value that is not a scalar
    with:
      n: [1]
# Permission scopes whose value or key is not a non-empty string
permissions:
  contents:
  issues: [read]
  ? [pages]
  : read
