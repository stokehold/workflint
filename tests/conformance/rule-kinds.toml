# workflint rule ID = actionlint kind, for every rule ID in the "Rule ID (kind)"
# column of docs/parity-checklist.md. The conformance runner maps the rule ID
# in workflint's output to its kind before it compares with a .out file.
# The conformance test `rule_kinds::rule-kinds.toml` fails when this table and
# the checklist disagree. M4.1 replaces this file with the rule registry.

