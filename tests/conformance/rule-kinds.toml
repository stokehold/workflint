# workflint rule ID = actionlint kind, for each rule ID in the "Rule ID (kind)"
# column of docs/parity-checklist.md that no crate defines yet. The rule
# registry in workflint-rules has the kinds of the rules that exist. The
# conformance runner maps the rule ID in workflint's output to its kind before
# it compares with a .out file. A task that adds a rule moves its rule IDs out
# of this file. The conformance test `rule_kinds::rule-kinds.toml` fails when a
# checklist rule ID is in both the registry and this file, or in neither.

pyflakes-issue = "pyflakes"
